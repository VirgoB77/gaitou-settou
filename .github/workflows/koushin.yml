name: 犯罪オープンデータを取り込む

# 手で押して動かす。あわせて月1回、配布元を見に行く。
# 兵庫県警は年1回しか出さないので、頻度はこれで足りる（共通仕様3.4）。
#
# **【2026-09-25 から、月1回の自動実行を一時停止している】**
# わけと戻し方は、下の schedule の所に書いた。
#
# **このサイトの取得は、この workflow の1本だけ。** 金庫（<公開用>-raw）は取りに行かない。
# 金庫は、生データ・取ってきた ZIP・観測の記録を受け取るだけの置き場（共通仕様9節）。
#
# 順番を崩さない：
#   取ってくる → 生データと観測の記録を金庫にしまう → しまえたことを確かめる
#   → 作る → 加工の記録を金庫にしまう → 検査 → 公開側に入れる
# **金庫にしまえなかった観測は、公開しない。**
on:
  workflow_dispatch:
  # **【一時停止 2026-09-25・統括判断】** 下の schedule: と - cron: の2行の頭に「#」を付けて止めた。
  # わけ：取りに行く相手（web.pref.hyogo.lg.jp）に、競売統計が毎朝7時30分に行っている。
  # 2日の朝にこちらも行くと、同じ相手に1日2本の置き場から行くことになる（相手の数で数える）。
  # 置き場をまたいで「今日どこへ行ったか」を控える仕組みができるまで、競売統計の1本に寄せる。
  # 戻すときは、その2行の頭の「#」を外すだけ（時刻は消していない。共通仕様「止める段と戻す段を同じ形で書く」）。
#  schedule:
    # 毎月2日 日本時間 朝7時（UTCの1日22時）。
    # GitHub Actions の cron は L（月末）を解釈しないので日付で書く。
#    - cron: "0 22 1 * *"

concurrency:
  group: koushin
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  koushin:
    runs-on: ubuntu-latest
    env:
      # 金庫（生データの置き場・private）の鍵があるか。
      HAS_VAULT: ${{ secrets.RAW_DEPLOY_KEY != '' }}
      # 金庫の名前は公開用の名前から決める（<公開用>-raw）。
      # 見張りと checkout が同じ名前を見るので、fork や仮の名前では存在せず止まる。
      RAW_REPO: ${{ github.repository }}-raw
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # 承認（data/ref/shounin/）の出どころを git の履歴で確かめる（common/kado.py）。
          # 浅い（shallow）ままだと、承認を数えられない
          fetch-depth: 0

      # **日付と開始時刻を、同じ1つの時刻から決める**（日本時間）。予約台帳（common/kado.py）は
      # 開始が今日の日付か・23時台でないかを、この2つで見る
      - name: この実行の日付と開始時刻を決める
        run: |
          t=$(TZ=Asia/Tokyo date +%Y-%m-%dT%H:%M:%S+09:00)
          echo "RUN_DATE=${t%%T*}" >> "$GITHUB_ENV"
          echo "RUN_HAJIME=${t}" >> "$GITHUB_ENV"

      # 予約台帳（repo横断。同じ相手へ、同じ日本時間の日に、2つの置き場・2つの実行から行かない）。
      # 門（common/kado.py）が、相手への最初の外部通信の直前に、ここへ予約を1つ書いて push する。
      # **鍵が無い・出せないときは、ここで失敗して止まる**（予約できない回は、どこへも取りに行かない）
      - name: 予約台帳の鍵があることの確認
        env:
          ARU: ${{ secrets.YOYAKU_DEPLOY_KEY != '' }}
        run: |
          [ "$ARU" = "true" ] || { echo "予約台帳の鍵（YOYAKU_DEPLOY_KEY）が無い。この回はどこへも取りに行かない"; exit 1; }

      - name: 予約台帳を隣に出す
        uses: actions/checkout@v4
        with:
          repository: VirgoB77/kujiraya-aite-yoyaku
          ref: main
          ssh-key: ${{ secrets.YOYAKU_DEPLOY_KEY }}
          path: _yoyaku

      - name: 予約台帳の場所を門に渡す
        run: |
          echo "YOYAKU_DIR=${GITHUB_WORKSPACE}/_yoyaku" >> "$GITHUB_ENV"
          echo "YOYAKU_REPO=VirgoB77/kujiraya-aite-yoyaku" >> "$GITHUB_ENV"

      # 共通仕様9節「2本のリポジトリ」。生データ（県警CSV・e-Statの境界）は private の金庫に置き、
      # ここには伏せ処理を通した結果とページだけを残す。
      #
      # このサイトは**生データの中身ではなく履歴のために**2本にしている（9節・2026-09-17）。
      # 元は警察のオープンデータなので生データ自体は公開してよい。
      # 分けている理由は金庫側の記録に置く。**公開側に弱点の在処を書かない。**
      # 公開用は履歴ゼロで作り、金庫は private のままにする。
      - name: 置き場を確かめる
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REPOSITORY" in
            *-raw|*-raw-*) echo "ここは金庫（$GITHUB_REPOSITORY）。金庫では走らない"; exit 1 ;;
          esac
          raw_tracked=$(git ls-files -- data/raw)
          if [ "$HAS_VAULT" = "true" ]; then
            if [ -n "$raw_tracked" ]; then
              echo "鍵があるのに、このリポジトリ自身が生データを追跡している。二重になるので止まる"
              exit 1
            fi
            # 金庫が private であることを確かめる。公開側の GITHUB_TOKEN から見えるなら（200）public。
            # private なら 404。それ以外（通信失敗・403）も止まる（疑わしきは止まる）。
            code=$(curl -s -o /dev/null -w '%{http_code}' \
                     -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
                     "https://api.github.com/repos/${RAW_REPO}" || true)
            case "$code" in
              404) echo "金庫 ${RAW_REPO} は公開側から見えない（private か、まだ無い）" ;;
              200) echo "金庫 ${RAW_REPO} が public のまま。生データを送らない。先に private にする"; exit 1 ;;
              *)   echo "金庫の見え方を確かめられなかった（HTTP ${code:-なし}）。止まる"; exit 1 ;;
            esac
            echo "金庫の形で動く"
            # ここ（確かめが通った、その成功の道だけ）で、門（common/kado.py）に
            # 金庫の場所を渡す。確かめられなかった道では書かない（次の checkout の前でも、
            # $GITHUB_ENV の値そのものは今書いてよい。参照するのはあとの段）
            echo "KINKO_DIR=${GITHUB_WORKSPACE}/_raw" >> "$GITHUB_ENV"
            echo "KINKO_PRIVATE=1" >> "$GITHUB_ENV"
          else
            echo "鍵が無い。生データを取りに行くと public に載るので、取りに行かずに止まる。"
            echo "Secret RAW_DEPLOY_KEY を入れる（docs/公開用リポジトリの作り方.md）"
            exit 1
          fi

      - name: 金庫を隣に出す
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RAW_REPO }}
          ref: main
          ssh-key: ${{ secrets.RAW_DEPLOY_KEY }}
          path: _raw
          fetch-depth: 0

      - name: 生データの置き場を金庫につなぐ
        run: |
          mkdir -p data _raw/data/raw
          rm -rf data/raw
          ln -s ../_raw/data/raw data/raw
          ls -la data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 共通仕様9節の例外。地図の形を扱うところだけ外部ライブラリを使う（README に理由）。
      - name: 要るものを入れる
        run: python -m pip install --quiet pyshp shapely

      # 共通仕様9節「ワークフローの最初のステップでテストを走らせる」。
      # 落ちたらここで止まり、取りに行かない。伏せ忘れがあると取りに行く前に止まる。
      - name: 検査する（昨日の出力に対して）
        run: |
          # 検査の一覧は scripts/check_all.sh が持つ。**ここには並べない。**
          # 同じ並びが workflow に2つ、手元に1つあって、1本足したときに
          # そのうち1か所を壊した（2026-09-19）。判断を2か所に置かない。
          GROUP=1 sh scripts/check_all.sh

      # 相手台帳（data/ref/aite-daicho.json）の正本は VirgoB77/ogataten-nippo。
      # ここ（gaitou-settou）はほかの置き場なので、取りに行く前に正本から読み直す。
      # 読めなければ、この回はどこへも取りに行かない（門・common/kado.py が相手台帳を見る）。
      # **この段は workflow が走るときだけ動く。**
      - name: 相手台帳を正本から読み直す
        run: |
          curl -fsS https://raw.githubusercontent.com/VirgoB77/ogataten-nippo/main/data/ref/aite-daicho.json -o data/ref/aite-daicho.json.new \
            && mv data/ref/aite-daicho.json.new data/ref/aite-daicho.json \
            || { rm -f data/ref/aite-daicho.json; echo "相手台帳を読めなかった。この回はどこへも取りに行かない"; }

      # **毎回、設定したものを全部取りに行く。** 在っても飛ばさない（理由は scripts/fetch_data.py の頭）。
      # 前回と同じ中身なら生データには触らない。取れなかったものは前回の生データを残す。
      # 観測の記録（data/raw/manifest/）は毎回1本残る。
      # 1本でも取れなかったら、この段は落ちる。次の「金庫にしまう」段だけ走り、公開には進まない。
      - name: 取ってくる
        id: fetch
        run: python scripts/fetch_data.py

      # **加工より先に、取ったものを金庫にしまう。** 金庫は private なので、公開側の検査を待たない。
      # 取れなかった回も、取れた分と観測の記録はしまう（「見に行って取れなかった」も記録）。
      # しまえたか（金庫の main に入ったか）は scripts/kinko_shimau.sh が確かめる。
      - name: 生データと観測の記録を金庫にしまう
        if: ${{ !cancelled() && steps.fetch.outcome != 'skipped' }}
        working-directory: _raw
        run: |
          # 観測の記録は毎回1本増える。増えていなければ、取得の段が記録を書く前に落ちている
          if [ -z "$(git ls-files --others --exclude-standard -- data/raw/manifest)" ]; then
            echo "観測の記録（data/raw/manifest）が増えていない。止まる"
            exit 1
          fi
          sh ../scripts/kinko_shimau.sh "生データを $(date -u +%Y-%m-%d) に観測した" data/raw

      # ここから先は、金庫にしまえた観測だけで作る（前の段が落ちたら走らない）。
      - name: 作る
        run: |
          python scripts/build.py
          python scripts/pages.py

      # 加工の記録（公開しないもの）も金庫に置く。しまえなかったら公開に進まない。
      - name: 加工の記録を金庫にしまう
        working-directory: _raw
        run: |
          mkdir -p data/reports
          cp -f ../data/parse-unknown.md data/reports/ 2>/dev/null || true
          cp -f ../data/build/unmatched.csv data/reports/ 2>/dev/null || true
          cp -f ../data/build/suppress-report.md data/reports/ 2>/dev/null || true
          sh ../scripts/kinko_shimau.sh "加工の記録を $(date -u +%Y-%m-%d) の時点で置いた" data/reports

      # 最初の検査は昨日の出力に対してなので、今日の出力の伏せ忘れは止められない。
      # ここで止める（止まっても生データはもう金庫にある）。
      - name: もう一度検査する（作ったものに対して）
        run: |
          # 検査の一覧は scripts/check_all.sh が持つ。**ここには並べない。**
          # 同じ並びが workflow に2つ、手元に1つあって、1本足したときに
          # そのうち1か所を壊した（2026-09-19）。判断を2か所に置かない。
          GROUP=1 sh scripts/check_all.sh

      - name: 結果をしまう
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 公開してよいと決めたものだけを列挙して入れる（許可リスト）。
          # data をまるごと add しない。新しい出力を公開したいときは、ここに1つ足す。
          # 足し忘れると「載らない」だけで済む。逆は済まない。
          #
          # 入れないもの：
          #   data/build/unmatched.csv       … 突合できなかった行の個票。割合は docs/突合率.md に出す
          #   data/build/suppress-report.md  … なぜ伏せたかの記録。理由は公開側に書かない（6節）
          #   data/parse-unknown.md          … 走らせた記録。金庫の data/reports に写す
          #
          # data/ref/aite-kyou.json・kikai-fuda.json は門（common/kado.py）自身の記録
          # （今日もう見たか・機械札）。次の回にも効くので、ここに含めて持ち越す。
          # 機械はこの2つ以外の data/ref/（カード・相手台帳・承認）を書き換えない。
          for p in index.html policy.html style.css sitemap.xml .nojekyll index.json \
                   cho data/build docs/突合率.md \
                   data/ref/aite-kyou.json data/ref/kikai-fuda.json; do
            if [ -e "$p" ] || [ -n "$(git ls-files -- "$p")" ]; then git add -A -- "$p"; fi
          done
          # data/build は市を足すたびに増えるので丸ごと入れるが、個票だけは外す。
          # 市コードを直書きすると、市を足したときに足し忘れる。
          git reset -q -- data/build/unmatched.csv data/build/suppress-report.md 2>/dev/null || true
          # 見張り：許可リストをいじっても、生データ・記録・取ってきた ZIP・symlink が混ざったら止まる
          if git diff --cached --name-only -z | tr '\0' '\n' \
               | grep -E '^(data/raw/|data/build/(unmatched\.csv|suppress-report\.md)$|data/[^/]+\.md$|_raw/)|\.zip$'; then
            echo "公開側の commit に生データか記録が混ざった。止まる"
            exit 1
          fi
          if git -c core.quotePath=false diff --cached --raw | awk '$2 == "120000"' | grep -q .; then
            echo "公開側の commit に symlink が混ざった。止まる"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "変わりなし。今回は何も起きていない"
            exit 0
          fi
          git commit -m "犯罪オープンデータを $(date -u +%Y-%m-%d) の時点で取り込んだ"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase --autostash -X theirs origin main || { git rebase --abort 2>/dev/null || true; exit 1; }
            sleep $((i * 3))
          done
          echo "5回試したが送れなかった"; exit 1
